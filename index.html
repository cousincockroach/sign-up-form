<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent-container">
        <div class="img-container"> <p> Photo by <a href="https://unsplash.com/@kevinmueller?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"> Kevin Mueller </a> on <a href="https://unsplash.com/photos/oranges-peek-through-lush-green-leaves-QGSrJHopKwY?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"> Unsplash</a> </p></div>
        <div class="form-container">
            <div class="header"><p>This is not a real online service. you know you need something
               like this in your life to help you realize your deepest dreams. <br> Sign up now to get you started.
               <br><br><br> You know you want to.</p>
            </div>
            <form id="myForm" action="/submit-form" method="POST" class="form-section" > <h2>Let's do this!</h2>
                <div class="names">
                <div>
                <label for="first-name">First Name</label>
                <br>
                <input type="text" id="first-name" name="first-name" required>
                </div>

                <div>
                    <label for="last-name">Last Name</label>
                    <br>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </div> 

            <div class="details">
                <div>
                <label for="email">Email</label>
                <br>
                <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <br>
                    <input type="Number" id="phone" name="phone" required>
                </div>
            </div> 

            <div class="password">
                <div>
                <label for="password">Password</label>
                <br>
                <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <label for="cpassword">Confirm Password</label>
                    <br>
                    <input type="password" id="cpassword" name="cpassword" required>
                </div>
            </div> 
                
        </form>
            <div class=" footer">
            <button type="submit" form="myForm">Create Account</button>    
            </div>

        </div>
    </div>
</body>
</html>
